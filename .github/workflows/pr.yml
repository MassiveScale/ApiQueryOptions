name: PR

"on":
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ApiQueryOptions.slnx

      - name: Build
        run: dotnet build ApiQueryOptions.slnx --no-restore --configuration Release /warnaserror

      - name: Test
        run: |
          dotnet run --project tests/ApiQueryOptions.Tests/ApiQueryOptions.Tests.csproj --configuration Release
          dotnet run --project tests/ApiQueryOptions.EntityFrameworkCore.Tests/ApiQueryOptions.EntityFrameworkCore.Tests.csproj --configuration Release
